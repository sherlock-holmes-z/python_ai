[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ai"
version = "0.1.0"
description = "A well-structured Python project template"
readme = "README.md"
# 项目统一使用 Python 3.12。限制在同一 minor 版本，避免不同电脑因为
# Python 3.13/3.14 的二进制扩展兼容性差异产生不同安装结果。
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
dependencies = [
    # 当前学习阶段默认安装 FastAPI，以及现有示例代码已经实际使用的 aiohttp/NumPy。
    # standard extra 同时提供 Uvicorn、FastAPI CLI、表单/模板等官方常用能力；
    # 固定到已核对支持 Python 3.12 的稳定版本，保证换电脑后的直接依赖一致。
    "fastapi[standard]==0.141.1",
    "aiohttp==3.14.3", # 现有协程下载示例使用的异步 HTTP 客户端，支持 Python 3.12。
    "numpy==2.5.2",    # 现有模块示例已经导入；同时也是后续数据处理/AI 计算的基础库。
]

[project.optional-dependencies]
# 开发工具会由 environment.yml 默认安装，但不会进入生产运行时依赖。
dev = [
    "mypy==2.3.1",          # 静态类型检查；固定稳定版，避免不同电脑规则漂移。
    "pre-commit==4.6.2",    # 提交前自动执行质量检查，与仓库现有 hooks 配合。
    "pytest==9.1.1",        # 单元/集成测试框架，当前稳定版支持 Python 3.12。
    "pytest-asyncio==1.4.0", # 测试 FastAPI、asyncio 等异步代码。
    "pytest-cov==7.1.0",    # 生成测试覆盖率，和 pytest 9 兼容。
    "ruff==0.16.4",         # 高性能 lint/format 工具，固定版本保证 CI 结果一致。
]

# 以下分组已经定义但不会被 environment.yml 默认安装。
# 学到对应阶段时，把分组名加入安装命令，例如：
# python -m pip install -e ".[dev,backend]"

backend = [
    "pydantic-settings==2.15.0", # 从环境变量/.env 读取类型安全配置，适合 FastAPI 配置管理。
    "sqlalchemy[asyncio]==2.0.52", # SQLAlchemy 2.x ORM 与异步数据库访问。
    "asyncpg==0.31.0",            # PostgreSQL 高性能异步驱动，仅学习 PostgreSQL 时安装。
    "alembic==1.19.1",            # 数据库结构版本管理，与 SQLAlchemy 2.x 配套。
    "redis==8.1.0",               # 缓存、分布式锁、限流和消息场景的 Redis 客户端。
    "pyjwt[crypto]==2.13.0",      # JWT 签发和验签；crypto extra 提供非对称算法支持。
    "pwdlib[argon2]==0.3.1",      # 使用 Argon2 安全哈希密码，符合 FastAPI 当前安全实践。
]

llm = [
    "openai==3.3.1",              # 调用 OpenAI 兼容模型 API，是学习大模型调用的基础 SDK。
    "langchain==1.3.17",          # LLM 应用编排抽象；固定 1.x 稳定线避免 API 大幅变化。
    "langchain-openai==1.6.0",    # LangChain 的 OpenAI 集成，版本与 LangChain 1.x 配套。
]

rag = [
    "langchain-community==0.4.2", # 社区文档加载器和外部系统集成，RAG 阶段再安装。
    "langchain-text-splitters==1.1.2", # 文档切分组件，与 LangChain 1.x 生态配套。
    "qdrant-client==1.19.0",      # Qdrant 向量数据库客户端，支持同步和异步访问。
    "pypdf==6.16.2",              # 提取 PDF 文本，常用于 RAG 知识库文档解析。
]

data = [
    "pandas==3.0.5",              # 表格数据清洗与分析，适合 AI 数据预处理。
    "scikit-learn==1.9.0",        # 传统机器学习、特征处理和模型评估。
    "jupyterlab==4.6.3",          # 交互式实验环境，仅数据分析/模型实验阶段需要。
]

# 本地深度学习依赖暂不定义成可直接安装的 extra。
# PyTorch 必须按照操作系统、CPU/GPU 和 CUDA 版本选择 wheel；直接固定一个通用安装源
# 可能导致换电脑后安装到 CPU 版或发生 CUDA 冲突。学到本地模型时，先根据 PyTorch
# 官方安装选择器安装 torch，再启用并安装下面这些包：
# local-ai = [
#     "torch==2.13.0",                 # 需按硬件选择安装源，不要直接取消注释后盲装。
#     "transformers==5.15.1",          # Hugging Face 模型加载、推理与训练接口。
#     "datasets==5.0.1",               # 数据集下载、缓存、流式加载和预处理。
#     "accelerate==1.14.0",            # 单机多卡/混合精度训练和推理封装。
#     "sentence-transformers==6.0.0",  # 文本向量模型，常用于本地 RAG Embedding。
# ]

[project.scripts]
python-ai = "python_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["python_ai"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
